[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-recommender"
version = "0.1.0"
description = "AI-powered restaurant recommendations over the Zomato Bangalore dataset, ranked and explained by an LLM served by Groq."
readme = "README.md"
# `str | None` syntax is used throughout; src/__init__.py also guards this at import (O-09).
requires-python = ">=3.11"
dependencies = [
    "groq>=1.0",
    "datasets>=2.19",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.36",
    "httpx>=0.27",  # the Streamlit UI's API client; also FastAPI's TestClient
    "rapidfuzz>=3.9",
    "ftfy>=6.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]
semantic = [
    "duckdb>=1.0",
    "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
include = ["src*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes `import src...` work regardless of install state; run pytest from the repo root (O-17).
pythonpath = ["."]
addopts = "-ra"
